# ImageSitter 桌面端原生后端；窗口捕获能力复用本地 winsitter SDK。
[package]
name = "imagesitter"
version = "1.0.0"
description = "ImageSitter - 游戏对象图形特征标记、校准与导出工具"
authors = ["ThinkBuddy"]
edition = "2021"
rust-version = "1.97.1"
default-run = "imagesitter"

[features]
default = []
cli = []

[[bin]]
name = "imagesitter"
path = "src/main.rs"

[[bin]]
name = "imagesitter-cli"
path = "src/bin/imagesitter-cli.rs"
required-features = ["cli"]

[lib]
name = "imagesitter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
sha2 = "0.10"
# 仅预览与导出路径编码 PNG；匹配热路径直接操作 RGBA 原始像素
image = { version = "0.25", default-features = false, features = ["png"] }
# 运行时加载预编译的 winsitter.dll（C ABI），不编译 SDK 源码
libloading = "0.8"
# ClientToScreen 换算屏幕坐标；令牌提升检测 + ShellExecuteW runas 动态 UAC 提权
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
